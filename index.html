<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Belén & Augusto — Para siempre</title>

<style>
html, body{
  margin:0;
  padding:0;
}

body{
  background:#020202;
  font-family: Georgia, serif;
  color:#e6e6e6;
  text-align:center;
  overflow-y:auto;
  overflow-x:hidden;
  min-height:200vh;
}

/* TELARAÑAS */
.corner{
  position:fixed;
  font-size:60px;
  opacity:0.25;
  z-index:5;
}
.tl{top:0;left:0}
.tr{top:0;right:0}
.bl{bottom:0;left:0}
.br{bottom:0;right:0}

/* NIEBLA */
.fog{
  position:fixed;
  inset:-50%;
  background:radial-gradient(circle, rgba(255,255,255,0.04), transparent 65%);
  animation:fog 60s linear infinite;
  pointer-events:none;
  z-index:0;
}
@keyframes fog{
  from{transform:translateX(0)}
  to{transform:translateX(-50%)}
}

/* LLUVIA */
.rain{
  position:fixed;
  width:2px;
  height:90px;
  background:rgba(255,255,255,0.15);
  animation:fall linear infinite;
  z-index:1;
  pointer-events:none;
}
@keyframes fall{
  from{transform:translateY(-120px)}
  to{transform:translateY(120vh)}
}

/* LUNA */
.moon{
  position:fixed;
  top:40px;
  right:40px;
  width:140px;
  height:140px;
  border-radius:50%;
  background:#d9d9d9;
  box-shadow:0 0 40px rgba(255,255,255,0.2);
  opacity:0.6;
  z-index:0;
}

/* SOBRE */
.envelope{
  width:260px;
  height:160px;
  margin:180px auto 80px;
  background:#111;
  border:2px solid #333;
  cursor:pointer;
  position:relative;
  z-index:10;
}
.envelope::before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(135deg, transparent 50%, #222 50%);
}

/* CARTA */
.card{
  width:320px;
  margin:40px auto 200px;
  padding:24px;
  background:#0b0b0b;
  border:2px solid #2a2a2a;
  opacity:0;
  transition:2s;
  line-height:1.9;
  box-shadow:0 0 40px rgba(0,0,0,0.9);
  position:relative;
  z-index:10;
}

.card img{
  width:100%;
  border-radius:10px;
  margin:16px 0;
  filter:grayscale(100%);
  animation:ghost 6s infinite;
}
@keyframes ghost{
  0%,100%{opacity:0.85}
  50%{opacity:0.6}
}

/* CORAZONES */
.heart{
  position:fixed;
  font-size:16px;
  animation:float 9s linear forwards, beat 1.2s infinite;
  z-index:2;
  pointer-events:none;
}
@keyframes float{
  from{bottom:-20px}
  to{bottom:110vh}
}
@keyframes beat{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.4)}
}

/* ARAÑAS */
.spider{
  position:fixed;
  font-size:20px;
  animation:spider 14s linear infinite;
  z-index:2;
  pointer-events:none;
}
@keyframes spider{
  from{top:-40px}
  to{top:110vh}
}

/* FIRMA */
#signature{
  margin-top:20px;
  font-style:italic;
  opacity:0;
  transition:3s;
}

/* FINAL */
#final{
  position:fixed;
  inset:0;
  background:black;
  color:#e6e6e6;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  opacity:0;
  pointer-events:none;
  transition:4s;
  z-index:20;
}
</style>
</head>

<body>

<div class="fog"></div>
<div class="moon"></div>

<div class="corner tl">🕸</div>
<div class="corner tr">🕸</div>
<div class="corner bl">🕸</div>
<div class="corner br">🕸</div>

<div class="envelope" onclick="openLetter()"></div>

<div class="card" id="card">
Para Belén 🖤

<img src="https://raw.githubusercontent.com/puki7x-art/Belen-y-yo/refs/heads/main/73bf100a-6804-4634-8108-da30b48e066d.jpeg">

<div id="text"></div>

<img src="https://raw.githubusercontent.com/puki7x-art/Belen-y-yo/refs/heads/main/eb5c7635-eef6-4f06-8bc6-9c9930e6cdbb.jpeg">

<div id="quote"></div>

<div id="signature">— Augusto</div>
</div>

<div id="final">
<h2>Belén & Augusto</h2>
<p>Para siempre ♾️</p>
<p style="margin-top:20px">Fin… o comienzo</p>
</div>

<audio id="thunder">
<source src="https://assets.mixkit.co/sfx/preview/mixkit-thunder-rumble-128.mp3">
</audio>

<audio id="music" loop>
<source src="https://assets.mixkit.co/music/preview/mixkit-dark-piano-123.mp3">
</audio>

<script>
const message=`Nuestro primer San Valentín,
con mi mejor amiga,
mi compañera,
mi eterno amor.

Te amo infinitamente
y quiero estar siempre a tu lado,
dormir en cucharita
y mucho bechoabacho.`;

const quote=`"Incluso en los lugares más oscuros,
el amor es lo único que nos mantiene vivos."
— Tim Burton`;

function typeText(id,text,speed){
  let i=0;
  const el=document.getElementById(id);
  el.textContent="";
  const t=setInterval(()=>{
    el.textContent+=text[i++];
    if(i>=text.length)clearInterval(t);
  },speed);
}

function openLetter(){
  document.querySelector(".envelope").style.display="none";
  document.getElementById("card").style.opacity=1;
  document.getElementById("thunder").play().catch(()=>{});
  document.getElementById("music").play().catch(()=>{});
  setTimeout(()=>typeText("text",message,45),800);
  setTimeout(()=>typeText("quote",quote,55),4200);
  setTimeout(()=>document.getElementById("signature").style.opacity=1,7500);
  setTimeout(()=>document.getElementById("final").style.opacity=1,14000);
}

/* lluvia */
for(let i=0;i<60;i++){
  let r=document.createElement("div");
  r.className="rain";
  r.style.left=Math.random()*100+"vw";
  r.style.animationDuration=(0.6+Math.random())+"s";
  document.body.appendChild(r);
}

/* corazones */
setInterval(()=>{
  let h=document.createElement("div");
  h.className="heart";
  h.innerHTML="🖤";
  h.style.left=Math.random()*100+"vw";
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),9000);
},800);

/* arañas */
setInterval(()=>{
  let s=document.createElement("div");
  s.className="spider";
  s.innerHTML="🕷";
  s.style.left=Math.random()*100+"vw";
  document.body.appendChild(s);
  setTimeout(()=>s.remove(),14000);
},4000);
</script>

</body>
</html>
