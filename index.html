<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Belén & Augusto — Para siempre</title>

<style>
body{
  margin:0;
  background:#040404;
  font-family: Georgia, serif;
  color:#e6e6e6;
  overflow-x:hidden;
  text-align:center;
}

/* 🌫 NIEBLA */
.fog{
  position:fixed;
  top:0;left:0;
  width:200%;
  height:200%;
  background:radial-gradient(circle at center, rgba(255,255,255,0.05), transparent 65%);
  animation:fog 50s linear infinite;
  pointer-events:none;
  z-index:0;
}
@keyframes fog{
  from{transform:translateX(0);}
  to{transform:translateX(-50%);}
}

/* 🌧 LLUVIA */
.rain{
  position:fixed;
  width:2px;
  height:90px;
  background:rgba(255,255,255,0.15);
  animation:fall linear infinite;
  pointer-events:none;
  z-index:0;
}
@keyframes fall{
  from{transform:translateY(-120px);}
  to{transform:translateY(120vh);}
}

/* 🕷 ARAÑAS */
.spider{
  position:fixed;
  font-size:20px;
  animation:spider 14s linear infinite;
  pointer-events:none;
  z-index:1;
}
@keyframes spider{
  from{top:-40px;}
  to{top:110vh;}
}

/* 🖤 CORAZONES */
.heart{
  position:fixed;
  font-size:16px;
  animation:float 8s linear forwards, beat 1.3s infinite;
  pointer-events:none;
  z-index:1;
}
@keyframes float{
  from{bottom:-20px;opacity:1;}
  to{bottom:110vh;opacity:0;}
}
@keyframes beat{
  0%,100%{transform:scale(1);}
  50%{transform:scale(1.35);}
}

/* 🔘 BOTÓN */
button{
  margin-top:120px;
  padding:16px 28px;
  background:#0e0e0e;
  border:2px solid #333;
  color:#e6e6e6;
  font-size:16px;
  cursor:pointer;
  letter-spacing:1px;
}

/* 📜 CARTA */
.card{
  width:300px;
  margin:40px auto;
  padding:20px;
  background:#0b0b0b;
  border:2px solid #2a2a2a;
  opacity:0;
  transition:2s;
  white-space:pre-line;
  line-height:1.8;
  box-shadow:0 0 30px rgba(0,0,0,0.8);
}

.card img{
  width:100%;
  border-radius:10px;
  margin:14px 0;
  filter:grayscale(100%) contrast(110%);
  animation:ghost 6s infinite;
}
@keyframes ghost{
  0%,100%{opacity:0.85;}
  50%{opacity:0.6;}
}

#forever{
  margin-top:16px;
  font-size:16px;
  opacity:0;
  transition:3s;
}
</style>
</head>

<body>

<div class="fog"></div>

<button onclick="openLetter()">🖤 Abrir la carta</button>

<div class="card" id="card">
Para Belén 🖤

<img src="https://raw.githubusercontent.com/puki7x-art/Belen-y-yo/refs/heads/main/73bf100a-6804-4634-8108-da30b48e066d.jpeg">

<div id="text"></div>

<img src="https://raw.githubusercontent.com/puki7x-art/Belen-y-yo/refs/heads/main/eb5c7635-eef6-4f06-8bc6-9c9930e6cdbb.jpeg">

<div id="quote"></div>

<div id="forever">
Belén & Augusto — Para siempre ♾️  
— Augusto
</div>
</div>

<!-- 🔊 TRUENO -->
<audio id="thunder" preload="auto">
<source src="https://assets.mixkit.co/sfx/preview/mixkit-thunder-rumble-128.mp3">
</audio>

<script>
const message = `
Nuestro primer San Valentín,
con mi mejor amiga,
mi compañera,
mi eterno amor.

Te amo infinitamente
y quiero estar siempre a tu lado,
dormir en cucharita
y mucho bechoabacho.
`;

const quote = `
“Incluso en los lugares más oscuros,
el amor es lo único
que nos mantiene vivos.”
— Tim Burton
`;

function typeText(id,text,speed){
  const el=document.getElementById(id);
  let i=0;
  el.textContent="";
  const int=setInterval(()=>{
    el.textContent+=text[i];
    i++;
    if(i>=text.length)clearInterval(int);
  },speed);
}

function openLetter(){
  const card=document.getElementById("card");
  card.style.opacity=1;

  document.getElementById("thunder").play().catch(()=>{});

  setTimeout(()=>typeText("text",message,45),600);
  setTimeout(()=>typeText("quote",quote,55),4600);
  setTimeout(()=>document.getElementById("forever").style.opacity=1,8000);
}

/* lluvia */
for(let i=0;i<70;i++){
  let r=document.createElement("div");
  r.className="rain";
  r.style.left=Math.random()*100+"vw";
  r.style.animationDuration=(0.6+Math.random())+"s";
  document.body.appendChild(r);
}

/* corazones */
setInterval(()=>{
  let h=document.createElement("div");
  h.className="heart";
  h.innerHTML="🖤";
  h.style.left=Math.random()*100+"vw";
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),9000);
},700);

/* arañas */
setInterval(()=>{
  let s=document.createElement("div");
  s.className="spider";
  s.innerHTML="🕷";
  s.style.left=Math.random()*100+"vw";
  document.body.appendChild(s);
  setTimeout(()=>s.remove(),14000);
},4000);
</script>

</body>
</html>
