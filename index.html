<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Belén & Augusto — Para siempre</title>

<style>
body{
  margin:0;
  background:#050505;
  font-family:Georgia, serif;
  color:#e6e6e6;
  overflow-x:hidden;
  text-align:center;
}

/* fondo */
.rain, .fog, .heart{
  position:fixed;
  pointer-events:none;
  z-index:0;
}

/* botón */
button{
  margin-top:120px;
  padding:14px 24px;
  background:#111;
  border:2px solid #333;
  color:#e6e6e6;
  font-size:16px;
  cursor:pointer;
  z-index:2;
}

/* carta */
.card{
  width:300px;
  margin:40px auto;
  padding:18px;
  background:#0e0e0e;
  border:2px solid #2a2a2a;
  opacity:0;
  transition:1.5s;
  white-space:pre-line;
  line-height:1.7;
  z-index:1;
}

.card img{
  width:100%;
  margin:12px 0;
  border-radius:8px;
  filter:grayscale(100%);
}

#forever{
  margin-top:14px;
  opacity:0;
  transition:2s;
}
</style>
</head>

<body>

<button onclick="openLetter()">🖤 Abrir la carta</button>

<div class="card" id="card">
Para Belén 🖤

<img src="https://raw.githubusercontent.com/puki7x-art/Belen-y-yo/refs/heads/main/73bf100a-6804-4634-8108-da30b48e066d.jpeg">

<div id="text"></div>

<img src="https://raw.githubusercontent.com/puki7x-art/Belen-y-yo/refs/heads/main/eb5c7635-eef6-4f06-8bc6-9c9930e6cdbb.jpeg">

<div id="quote"></div>

<div id="forever">
Belén & Augusto — Para siempre ♾️  
— Augusto
</div>
</div>

<audio id="thunder" preload="auto">
<source src="https://assets.mixkit.co/sfx/preview/mixkit-thunder-rumble-128.mp3">
</audio>

<script>
const message = `
Nuestro primer San Valentín,
con mi mejor amiga,
mi compañera,
mi eterno amor.

Te amo infinitamente
y quiero estar siempre a tu lado,
dormir en cucharita
y mucho bechoabacho.
`;

const quote = `
“Incluso en los lugares más oscuros,
el amor es lo único
que nos mantiene vivos.”
— Tim Burton
`;

function typeText(id,text,speed){
  const el=document.getElementById(id);
  let i=0;
  el.textContent="";
  const int=setInterval(()=>{
    el.textContent+=text[i];
    i++;
    if(i>=text.length)clearInterval(int);
  },speed);
}

function openLetter(){
  const card=document.getElementById("card");
  card.style.opacity=1;

  document.getElementById("thunder").play().catch(()=>{});

  setTimeout(()=>typeText("text",message,45),500);
  setTimeout(()=>typeText("quote",quote,55),4500);
  setTimeout(()=>document.getElementById("forever").style.opacity=1,7500);
}
</script>

</body>
</html>
