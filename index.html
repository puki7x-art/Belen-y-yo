<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Belén & Augusto — Para siempre</title>

<style>
html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  background:#050505;
  overflow:hidden;
  font-family: "Georgia", serif;
  color:#e6e6e6;
}

/* 🌫️ NIEBLA */
.fog{
  position:absolute;
  width:200%;
  height:200%;
  background:radial-gradient(circle at center, rgba(255,255,255,0.05), transparent 60%);
  animation:fogmove 40s linear infinite;
  z-index:2;
}
@keyframes fogmove{
  from{transform:translateX(0);}
  to{transform:translateX(-50%);}
}

/* 🌧️ LLUVIA */
.rain{
  position:absolute;
  width:2px;
  height:90px;
  background:rgba(255,255,255,0.15);
  animation:fall linear infinite;
  z-index:1;
}
@keyframes fall{
  from{transform:translateY(-100px);}
  to{transform:translateY(110vh);}
}

/* 🖤 CORAZONES */
.heart{
  position:absolute;
  font-size:16px;
  animation:float 8s linear forwards, beat 1.2s infinite;
  z-index:3;
}
@keyframes float{
  from{bottom:-20px; opacity:1;}
  to{bottom:110vh; opacity:0;}
}
@keyframes beat{
  0%,100%{transform:scale(1);}
  50%{transform:scale(1.3);}
}

/* ✉️ SOBRE */
.envelope{
  position:absolute;
  width:220px;
  height:140px;
  background:#111;
  border:2px solid #333;
  top:40%;
  left:50%;
  transform:translate(-50%,-50%);
  cursor:pointer;
  z-index:4;
}
.flap{
  position:absolute;
  width:100%;
  height:100%;
  background:#1a1a1a;
  clip-path:polygon(0 0, 100% 0, 50% 50%);
  transform-origin:top;
  transition:1.2s;
}

/* 📜 CARTA */
.card{
  position:absolute;
  width:300px;
  min-height:520px;
  background:#0e0e0e;
  border:2px solid #2a2a2a;
  top:20px;
  left:50%;
  transform:translateX(-50%) translateY(40px);
  padding:18px;
  opacity:0;
  transition:2s;
  text-align:center;
  font-size:15px;
  line-height:1.6;
  z-index:5;
}

.card img{
  width:100%;
  border-radius:8px;
  margin:12px 0;
  opacity:0.85;
  filter:grayscale(100%) blur(0.3px);
}

h2{
  margin-top:5px;
  font-size:18px;
  letter-spacing:1px;
}

#forever{
  margin-top:14px;
  font-size:16px;
  opacity:0;
  transition:2s;
}
</style>
</head>

<body>

<div class="fog"></div>

<div class="envelope" onclick="openLetter()">
  <div class="flap" id="flap"></div>
</div>

<div class="card" id="card">
  <h2>Para Belén 🖤</h2>

  <img src="https://raw.githubusercontent.com/puki7x-art/Belen-y-yo/refs/heads/main/73bf100a-6804-4634-8108-da30b48e066d.jpeg">

  <div id="text"></div>

  <img src="https://raw.githubusercontent.com/puki7x-art/Belen-y-yo/refs/heads/main/eb5c7635-eef6-4f06-8bc6-9c9930e6cdbb.jpeg">

  <div id="quote"></div>

  <div id="forever">
    Belén & Augusto — Para siempre ♾️
    <br><br>
    — Augusto
  </div>
</div>

<!-- 🔊 SONIDO TRUENO -->
<audio id="thunder">
  <source src="https://assets.mixkit.co/sfx/preview/mixkit-thunder-rumble-128.mp3" type="audio/mpeg">
</audio>

<script>
const message = `
Nuestro primer San Valentín,
con mi mejor amiga,
mi compañera,
mi eterno amor.

Te amo infinitamente
y quiero estar siempre a tu lado,
dormir en cucharita
y mucho bechoabacho.
`;

const quote = `
“Incluso en los lugares más oscuros,
el amor es lo único
que nos mantiene vivos.”
— Tim Burton
`;

function typeText(id, text, speed){
  const el = document.getElementById(id);
  el.innerHTML = "";
  let i = 0;
  const interval = setInterval(() => {
    if (text[i] === "\n") el.innerHTML += "<br>";
    else el.innerHTML += text[i];
    i++;
    if (i >= text.length) clearInterval(interval);
  }, speed);
}

function openLetter(){
  document.getElementById("flap").style.transform = "rotateX(180deg)";
  document.getElementById("thunder").play();

  const card = document.getElementById("card");
  card.style.opacity = "1";
  card.style.transform = "translateX(-50%) translateY(-40px)";

  setTimeout(() => typeText("text", message, 45), 900);
  setTimeout(() => typeText("quote", quote, 55), 5200);
  setTimeout(() => {
    document.getElementById("forever").style.opacity = 1;
  }, 8500);
}

/* 🌧️ lluvia */
for(let i=0;i<80;i++){
  let r=document.createElement("div");
  r.className="rain";
  r.style.left=Math.random()*100+"vw";
  r.style.animationDuration=(0.6+Math.random())+"s";
  document.body.appendChild(r);
}

/* 🖤 corazones */
setInterval(()=>{
  let h=document.createElement("div");
  h.className="heart";
  h.innerHTML="🖤";
  h.style.left=Math.random()*100+"vw";
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),9000);
},500);
</script>

</body>
</html>
